# Weekly pull requests that keep pinned versions current: the commit-pinned
# actions in .github/workflows, the npm test dependencies, and ansible-core.
#
# js-yaml is also loaded from cdnjs by index.html. When Dependabot bumps it in
# package.json, the "page loads the js-yaml version the tests use" test fails until
# the CDN URL and its integrity hash in index.html are updated to match.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
