name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      # PyYAML and ansible-playbook let the YAML 1.1 and real-Ansible tests run
      # instead of being skipped.
      - run: pip install ansible-core
      - run: npm ci
      - run: npm test
